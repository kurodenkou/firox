# Anaconda installer ISO: one ISO for every computer.
# The installer asks only which disk to use (Installation Destination);
# everything else is answered here, and it restarts by itself when it's done.
# There's no account and no root password yet: Firox's own first-time setup
# (firox-oobe, on the login screen) asks for the network, time zone,
# keyboard, account and computer name, then gets the latest Firox (the
# NVIDIA image on computers with an NVIDIA graphics card).
[customizations.installer.kickstart]
contents = """
lang en_US.UTF-8
keyboard us
timezone UTC --utc
network --bootproto=dhcp --device=link --activate --onboot=on
rootpw --lock
reboot

%post
# Point updates at the published image this ISO was built from: the
# standard image or the NVIDIA one (the image records which in
# /usr/share/firox/image-ref; images built before that file existed are
# recognised by their NVIDIA driver packages).
ref="$(cat /usr/share/firox/image-ref 2>/dev/null)"
if [ -z "$ref" ]; then
    if rpm -qa 'kmod-nvidia*' 'nvidia-driver*' | grep -q .; then
        ref=ghcr.io/kurodenkou/firox-nvidia-open:latest
    else
        ref=ghcr.io/kurodenkou/firox:latest
    fi
fi
bootc switch --mutate-in-place --transport registry "$ref"

# First-time setup on the first start (firox-greeter shows it while this exists)
mkdir -p /var/lib/firox
touch /var/lib/firox/oobe
%end
"""

[customizations.installer.modules]
enable = [
  "org.fedoraproject.Anaconda.Modules.Storage",
  "org.fedoraproject.Anaconda.Modules.Runtime",
  "org.fedoraproject.Anaconda.Modules.Network",
  "org.fedoraproject.Anaconda.Modules.Security",
  "org.fedoraproject.Anaconda.Modules.Users",
  "org.fedoraproject.Anaconda.Modules.Timezone"
]
disable = [
  "org.fedoraproject.Anaconda.Modules.Services",
  "org.fedoraproject.Anaconda.Modules.Subscription"
]

# Firox: if freshclam stops (offline at boot, the mirror busy...), try again
# in 15 minutes instead of leaving the virus definitions to age until the
# next restart. Its folder is made by /usr/lib/tmpfiles.d/firox-clamav.conf.
[Unit]
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=15min

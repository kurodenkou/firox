<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Firox fox-dragon mascot</title>
  <defs>
    <style>
      .o { stroke: #13245c; stroke-width: 7; stroke-linejoin: round; stroke-linecap: round; }
      .t { stroke: #13245c; stroke-width: 4; stroke-linejoin: round; stroke-linecap: round; fill: none; }
    </style>
  </defs>

  <!-- Wing (behind body) -->
  <g id="wing" transform="translate(290 260) scale(1.12) translate(-290 -260)">
    <path class="o" fill="#f26a1b" d="M 282 244 C 300 190 332 142 374 106 C 404 150 430 220 442 304 C 428 290 412 284 398 292 C 390 274 376 266 362 272 C 352 258 338 252 324 258 C 314 266 300 272 290 274 Z"/>
    <path fill="#f5a623" d="M 374 120 C 396 160 414 220 424 282 C 414 278 404 278 398 282 C 392 230 384 170 374 120 Z M 366 130 C 372 180 372 230 362 262 C 354 254 344 250 334 250 C 346 210 358 170 366 130 Z"/>
    <path class="t" d="M 374 106 C 386 170 396 230 398 292 M 374 106 C 370 160 366 220 362 272 M 374 106 C 352 160 336 210 324 258"/>
    <path class="o" fill="#2f62c0" d="M 278 250 C 296 196 330 146 374 104 C 380 98 390 100 388 110 C 354 152 324 204 304 258 Z"/>
    <path class="o" fill="#5fa0e8" d="M 378 104 L 392 86 L 388 108 Z"/>
  </g>

  <!-- Tail sweeping left along the ground -->
  <g id="tail">
    <path class="o" fill="#2f62c0" d="M 336 380 C 380 400 392 452 330 468 C 260 484 180 478 128 452 C 120 446 120 438 130 436 C 190 446 250 446 296 436 C 330 428 336 410 320 396 Z"/>
    <path fill="#5fa0e8" d="M 300 446 C 250 458 190 458 140 446 C 190 462 260 466 312 454 C 340 446 350 430 346 414 C 340 430 326 440 300 446 Z"/>
    <!-- Fur turning to fire at the tip -->
    <path class="o" fill="#f26a1b" d="M 210 446 C 180 450 150 448 128 440 C 104 430 88 404 92 372 C 100 388 108 394 116 396 C 108 366 112 330 132 300 C 132 328 142 348 154 356 C 156 330 166 312 182 300 C 178 330 186 356 200 368 C 204 352 212 342 224 336 C 220 360 226 384 240 398 C 228 404 224 412 232 420 C 218 422 212 432 220 442 Z"/>
    <path fill="#f5a623" d="M 196 438 C 168 440 140 434 124 420 C 114 404 114 388 120 374 C 128 392 140 398 150 398 C 146 374 150 352 162 334 C 164 360 174 378 190 386 C 192 372 198 362 208 356 C 206 380 212 400 224 412 C 210 418 204 428 196 438 Z"/>
    <path fill="#5fa0e8" d="M 140 410 C 134 392 138 376 146 366 C 148 384 156 396 166 402 C 158 408 150 410 140 410 Z"/>
    <path class="o" fill="#f26a1b" d="M 106 326 C 100 312 104 298 114 290 C 114 304 120 312 126 318 C 120 324 112 328 106 326 Z"/>
  </g>

  <!-- Body -->
  <g id="body">
    <path class="o" fill="#2f62c0" d="M 262 204 C 302 228 332 270 346 320 C 360 372 350 412 318 424 L 222 428 C 216 382 212 332 204 292 C 198 258 190 232 184 216 Z"/>
    <!-- Haunch -->
    <path class="o" fill="#2f62c0" d="M 268 364 C 274 322 334 314 352 358 C 364 394 340 422 302 424 C 276 424 264 396 268 364 Z"/>
    <path fill="#5fa0e8" d="M 280 350 C 296 330 330 330 344 352 C 326 340 300 340 280 350 Z"/>
    <!-- Back paw -->
    <path class="o" fill="#2f62c0" d="M 284 412 C 300 410 322 412 336 418 C 340 424 334 430 326 430 L 286 430 C 278 428 278 416 284 412 Z"/>
    <path class="t" d="M 300 422 L 300 430 M 314 422 L 314 430"/>
    <!-- Planted front leg -->
    <path class="o" fill="#1f4aa0" d="M 228 300 C 230 340 234 380 234 412 C 224 416 222 428 234 430 L 266 430 C 276 428 272 416 262 412 C 260 380 262 340 262 300 Z"/>
    <path class="t" d="M 246 420 L 246 430 M 256 420 L 256 430"/>
    <!-- Cream chest bib -->
    <path class="o" fill="#f3ead6" d="M 182 214 C 196 246 210 280 222 318 L 228 306 L 236 324 L 242 300 L 252 312 C 254 280 258 248 262 218 Z"/>
    <!-- Raised near paw -->
    <path class="o" fill="#2f62c0" d="M 238 296 C 222 314 208 332 198 346 C 188 352 188 366 200 368 C 214 370 224 362 226 350 C 234 336 248 320 260 306 Z"/>
    <path class="t" d="M 202 356 L 196 366 M 212 356 L 208 368"/>
  </g>

  <!-- Head -->
  <g id="head">
    <!-- Far ear -->
    <path class="o" fill="#2f62c0" d="M 166 152 C 156 122 148 94 146 64 C 170 80 192 100 204 120 Z"/>
    <path fill="#5fa0e8" d="M 168 138 C 162 116 158 98 158 82 C 172 94 182 106 190 120 Z"/>
    <!-- Curved horns -->
    <path class="o" fill="#1f4aa0" d="M 192 118 C 186 92 194 66 216 46 C 222 42 226 46 222 50 C 208 68 206 94 212 116 Z"/>
    <path class="o" fill="#1f4aa0" d="M 222 112 C 222 84 236 60 262 44 C 268 42 270 46 266 50 C 248 66 242 92 244 116 Z"/>
    <path class="t" stroke="#5fa0e8" stroke-width="3" d="M 196 98 L 206 100 M 198 82 L 208 86 M 228 92 L 238 96 M 234 76 L 244 80"/>
    <!-- Skull -->
    <path class="o" fill="#2f62c0" d="M 136 206 C 150 190 160 174 168 156 C 172 126 192 108 222 106 C 254 104 276 124 280 152 C 284 170 280 186 270 198 L 284 206 L 264 212 L 274 224 L 250 222 C 232 228 206 232 188 228 C 170 224 152 218 138 212 Z"/>
    <!-- Near ear -->
    <path class="o" fill="#2f62c0" d="M 238 114 C 250 90 270 72 294 60 C 296 90 290 122 278 148 Z"/>
    <path fill="#5fa0e8" d="M 252 114 C 262 98 274 86 286 78 C 286 98 282 118 274 134 Z"/>
    <!-- Brow highlight -->
    <path fill="#5fa0e8" d="M 182 140 C 196 128 222 124 246 132 C 226 132 204 136 186 148 Z"/>
    <!-- Cream muzzle and cheek ruff -->
    <path class="o" fill="#f3ead6" d="M 140 210 C 160 214 182 214 202 206 C 214 196 228 192 242 198 L 256 212 L 238 212 L 246 224 C 226 230 200 232 182 228 C 162 224 150 218 140 212 Z"/>
    <!-- Smile -->
    <path class="t" d="M 150 212 C 164 220 182 220 196 210"/>
    <!-- Nose -->
    <path fill="#13245c" d="M 128 204 C 132 196 144 196 148 202 C 150 210 140 214 132 212 C 128 210 126 208 128 204 Z"/>
    <!-- Eyes -->
    <g transform="translate(174 166) rotate(-8) scale(1.3)">
      <path fill="#13245c" d="M -12 0 C -6 -9 6 -9 12 0 C 6 7 -6 7 -12 0 Z"/>
      <ellipse cx="0" cy="-0.5" rx="8" ry="5.5" fill="#f5a623"/>
      <ellipse cx="0.5" cy="-0.5" rx="2.6" ry="5" fill="#13245c"/>
      <circle cx="-3" cy="-2.5" r="1.8" fill="#ffffff"/>
    </g>
    <g transform="translate(226 162) rotate(-8) scale(1.3)">
      <path fill="#13245c" d="M -13 0 C -6 -10 7 -10 14 0 C 7 8 -6 8 -13 0 Z"/>
      <ellipse cx="0.5" cy="-0.5" rx="9" ry="6" fill="#f5a623"/>
      <ellipse cx="1" cy="-0.5" rx="2.8" ry="5.5" fill="#13245c"/>
      <circle cx="-2.5" cy="-3" r="2" fill="#ffffff"/>
    </g>
  </g>
</svg>
